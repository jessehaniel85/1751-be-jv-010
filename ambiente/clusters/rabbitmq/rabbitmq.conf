# Os três nós se encontram por uma lista fixa (peer discovery "classic config").
# Em produção a lista costuma vir do Kubernetes, do DNS ou do Consul; a ideia é a mesma.
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbit-1
cluster_formation.classic_config.nodes.2 = rabbit@rabbit-2
cluster_formation.classic_config.nodes.3 = rabbit@rabbit-3

# Só para a demo: libera o usuário guest/guest fora do localhost (o painel no navegador
# chega ao contêiner por rede). Nunca faça isso em ambiente compartilhado.
loopback_users = none
